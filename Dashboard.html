<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Wierd & Bette</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style type="text/tailwindcss">
        body { font-family: 'Inter', sans-serif; background-color: #F7F5F0; }
        h1, h2 { font-family: 'Playfair Display', serif; }
        .card { @apply bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="login-view" class="min-h-[80vh] flex items-center justify-center">
        <div class="bg-white p-10 rounded-3xl shadow-xl border border-gray-100 max-w-md w-full mx-4">
            <div class="text-center mb-8">
                <h2 class="text-4xl text-gray-800 font-bold mb-2">Beheerder</h2>
                <p class="text-gray-500 uppercase tracking-widest font-semibold text-xs">Wierd & Bette</p>
            </div>
            
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">E-mailadres</label>
                    <input type="email" id="admin-email" required class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#D7A7B7] outline-none transition" placeholder="naam@email.nl">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Wachtwoord</label>
                    <input type="password" id="admin-password" required class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#D7A7B7] outline-none transition" placeholder="••••••••">
                </div>
                <p id="login-error" class="text-red-500 text-sm hidden font-bold text-center italic"></p>
                <button type="submit" id="login-btn" class="w-full bg-[#D7A7B7] hover:bg-[#C58D9E] text-white py-4 rounded-xl font-bold transition shadow-md">Inloggen</button>
            </form>
        </div>
    </div>

    <div id="dashboard-view" class="max-w-6xl mx-auto hidden">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-4xl text-gray-800 font-bold">RSVP Overzicht</h1>
                <p class="text-gray-500 uppercase tracking-widest font-semibold text-sm">Wierd & Bette - 2 augustus 2026</p>
            </div>
            <div class="flex gap-4">
                <button onclick="window.print()" class="bg-white hover:bg-gray-50 border border-gray-200 text-gray-700 px-6 py-2 rounded-xl font-bold transition shadow-sm">Afdrukken</button>
                <button onclick="window.logoutAdmin()" class="bg-gray-800 hover:bg-gray-900 text-white px-6 py-2 rounded-xl font-bold transition shadow-sm">Uitloggen</button>
            </div>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="card">
                <div>
                    <p class="text-xs text-gray-400 uppercase font-bold tracking-wider">Totaal Gasten</p>
                    <p id="stat-total" class="text-4xl font-bold text-gray-800 mt-1">0</p>
                </div>
                <div class="flex gap-2 mt-3 text-sm font-bold">
                    <span class="text-purple-700 bg-purple-100 px-2 py-1 rounded">Dag: <span id="stat-dag">0</span></span>
                    <span class="text-gray-600 bg-gray-100 px-2 py-1 rounded">Avond: <span id="stat-avond">0</span></span>
                </div>
            </div>
            <div class="card">
                <div>
                    <p class="text-xs text-gray-400 uppercase font-bold tracking-wider text-[#B8860B]">Diner (Daggasten)</p>
                    <p id="stat-dinner" class="text-4xl font-bold text-[#B8860B] mt-1">0</p>
                </div>
            </div>
            <div class="card">
                <div>
                    <p class="text-xs text-gray-400 uppercase font-bold tracking-wider text-[#D7A7B7]">Ceremonie</p>
                    <p id="stat-ceremony" class="text-4xl font-bold text-[#D7A7B7] mt-1">0</p>
                </div>
            </div>
            <div class="card">
                <div>
                    <p class="text-xs text-gray-400 uppercase font-bold tracking-wider text-blue-500">Feest</p>
                    <p id="stat-party" class="text-4xl font-bold text-blue-500 mt-1">0</p>
                </div>
            </div>
        </div>

        <div class="card !p-0">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 border-b border-gray-100">
                        <tr>
                            <th class="p-4 font-bold text-gray-600">Contactpersoon</th>
                            <th class="p-4 font-bold text-gray-600">Type</th>
                            <th class="p-4 font-bold text-gray-600">Gasten</th>
                            <th class="p-4 font-bold text-gray-600">Programma</th>
                            <th class="p-4 font-bold text-gray-600">Dieet / Opmerkingen</th>
                            <th class="p-4 font-bold text-gray-600 text-center">Acties</th>
                        </tr>
                    </thead>
                    <tbody id="rsvp-table-body" class="divide-y divide-gray-50 italic">
                        <tr><td colspan="6" class="p-8 text-center text-gray-400">Laden...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC19ashqWeuxrfsQ8sN1J5YIDwKmMs86P8",
            authDomain: "trouw-website-7245a.firebaseapp.com",
            projectId: "trouw-website-7245a",
            storageBucket: "trouw-website-7245a.firebasestorage.app",
            messagingSenderId: "1025347648187",
            appId: "1:1025347648187:web:1b7d1e77cd99b46bed479e"
        };

        const dbPathId = 'bette-wierd-bruiloft';
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const loginBtn = document.getElementById('login-btn');

        let unsubscribe = null;

        // --- AUTHENTICATIE LOGICA ---
        onAuthStateChanged(auth, (user) => { 
            // We checken of er een user is EN of deze een email heeft (beheerder)
            if (user && !user.isAnonymous && user.email === 'bruiloftwierdenbette@outlook.com') {
                loginView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                loadData(); 
            } else if (user) {
                // Als het een anonieme gebruiker is (restje van RSVP pagina), log deze direct uit
                signOut(auth);
            } else {
                // Helemaal niemand ingelogd
                dashboardView.classList.add('hidden');
                loginView.classList.remove('hidden');
                if (unsubscribe) { unsubscribe(); unsubscribe = null; }
            }
        });

        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;

            loginBtn.innerText = "Bezig...";
            loginBtn.disabled = true;
            loginError.classList.add('hidden');

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                console.error(err);
                loginError.innerText = "Oeps! E-mailadres of wachtwoord onjuist.";
                loginError.classList.remove('hidden');
            } finally {
                loginBtn.innerText = "Inloggen";
                loginBtn.disabled = false;
            }
        };

        window.logoutAdmin = () => {
            if (unsubscribe) {
                unsubscribe();
                unsubscribe = null;
            }
            signOut(auth);
        };

        // --- DATA LOGICA ---
        window.deleteRSVP = async (id, name) => {
            if (confirm(`Weet je zeker dat je de aanmelding van '${name}' wilt verwijderen?`)) {
                try {
                    await deleteDoc(doc(db, 'artifacts', dbPathId, 'public', 'data', 'rsvps', id));
                } catch (err) {
                    console.error("Fout bij verwijderen:", err);
                    alert("Geen rechten om te verwijderen.");
                }
            }
        };

        function loadData() {
            const rsvpRef = collection(db, 'artifacts', dbPathId, 'public', 'data', 'rsvps');
            
            // We slaan de luisteraar op in 'unsubscribe' zodat we hem bij uitloggen kunnen stoppen
            unsubscribe = onSnapshot(rsvpRef, (snapshot) => {
                const rsvps = [];
                snapshot.forEach(doc => {
                    rsvps.push({ id: doc.id, ...doc.data() });
                });
                renderDashboard(rsvps);
            }, (error) => {
                // Foutmelding alleen tonen als we écht als admin proberen te kijken en het misgaat
                if(auth.currentUser && !auth.currentUser.isAnonymous && error.code === 'permission-denied') {
                    console.error("Fout bij ophalen data:", error);
                    alert("Je account heeft geen rechten om de data te lezen.");
                }
            });
        }

        function renderDashboard(data) {
            const tbody = document.getElementById('rsvp-table-body');
            tbody.innerHTML = '';
            
            let t = 0; let dag = 0; let avond = 0; let c = 0; let d = 0; let p = 0;
            data.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            data.forEach(rsvp => {
                const n = rsvp.guests ? rsvp.guests.length : 0; 
                t += n;
                if (rsvp.type === 'Daggast') { dag += n; } else { avond += n; }
                if(rsvp.ceremony) c += n; 
                if(rsvp.dinner) d += n; 
                if(rsvp.party) p += n;
                
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition font-sans not-italic text-sm";
                const prog = [];
                if(rsvp.dinner) prog.push('<span class="bg-amber-100 text-amber-700 px-2 py-1 rounded text-xs font-bold mr-1">Diner</span>');
                if(rsvp.ceremony) prog.push('<span class="bg-pink-100 text-pink-700 px-2 py-1 rounded text-xs font-bold mr-1">Ceremonie</span>');
                if(rsvp.party) prog.push('<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold mr-1">Feest</span>');
                
                tr.innerHTML = `
                    <td class="p-4 font-semibold text-gray-800">${rsvp.contact}<br><span class="text-xs font-normal text-gray-400">${rsvp.email}</span></td>
                    <td class="p-4"><span class="px-3 py-1 rounded-full text-xs font-bold ${rsvp.type==='Daggast'?'bg-purple-100 text-purple-700':'bg-gray-100 text-gray-600'}">${rsvp.type}</span></td>
                    <td class="p-4 text-gray-600 italic">${rsvp.guests.join(', ')}</td>
                    <td class="p-4"><div class="flex flex-wrap gap-1">${prog.join('')}</div></td>
                    <td class="p-4 text-gray-500">${rsvp.diet&&rsvp.diet!=='N/A'?`<strong class="text-red-400">Dieet:</strong> ${rsvp.diet}`:'-'}</td>
                    <td class="p-4 text-center">
                        <button onclick="window.deleteRSVP('${rsvp.id}', '${rsvp.contact}')" class="text-red-400 hover:text-red-600 transition p-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            
            document.getElementById('stat-total').innerText = t;
            document.getElementById('stat-dag').innerText = dag;
            document.getElementById('stat-avond').innerText = avond;
            document.getElementById('stat-ceremony').innerText = c;
            document.getElementById('stat-dinner').innerText = d;
            document.getElementById('stat-party').innerText = p;
        }
    </script>
</body>
</html>
